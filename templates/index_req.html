<!DOCTYPE html>
<html>
<head>
    <title>Requirements Analyzer</title>

    <style>
        body {font-family: Arial; margin: 30px;}
        textarea {width: 100%; height: 250px;}
        .result {margin-top: 20px; padding: 15px; border: 1px solid #ccc;}
    </style>
</head>

<body>
<h1>Requirements Analyzer</h1>
<p>Enter one requirement per line:</p>
<textarea id="requirements"></textarea>
<br><br>
<label>
Threshold:
<input type="number"
       id="threshold"
       value="0.8"
       step="0.05"
       min="0"
       max="1">
</label>
<button onclick="analyze()">
Analyze
</button>
<div id="result" class="result"></div>
<script>
async function analyze() {
    const requirements =
        document
            .getElementById("requirements")
            .value
            .split("\n")
            .filter(x => x.trim());
    const threshold = document.getElementById("threshold").value;
    const response = await fetch("/reason", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({requirements, threshold})
    });
    const data = await response.json();
    let html = `<h2>Satisfaction Score: ${data.satisfaction_level}</h2>`;
    for (const category in data.issues) {
        html += `<h3>${category}</h3><ul>`;
        data.issues[category].forEach(issue => {
            html += `<li>${issue}</li>`;
        });
        html += `</ul>`;
    }

    html += `
        <h3>Analysis Log</h3>
        ${data.log_content}
    `;
    document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
